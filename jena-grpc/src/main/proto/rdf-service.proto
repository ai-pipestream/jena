syntax = "proto3";

package org.apache.jena.grpc;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "binary-rdf.proto";

option java_package = "org.apache.jena.grpc.wire";
option java_outer_classname = "PB_RDFService";

// Wire frame emitted by QuerySelect: the first message carries the RDF_VarTuple header
// and subsequent messages carry RDF_DataTuple binding rows.
message RDF_SelectRow {
  oneof item {
    org.apache.jena.riot.protobuf.wire.RDF_VarTuple  header = 1;
    org.apache.jena.riot.protobuf.wire.RDF_DataTuple row    = 2;
  }
}

// gRPC service exposing a Jena DatasetGraph over PB_RDF streaming messages,
// SPARQL Query/Update, and RDFPatch replication.
//
// Metadata headers:
//   x-jena-txn-id         (ASCII)  : Active transaction identifier returned by BeginTxn.
//   x-jena-graph-term-bin (binary) : Serialized RDF_Term identifying the target graph for LoadGraph / PutGraph.
service RDFDatasetService {
  rpc FindStream(org.apache.jena.riot.protobuf.wire.RDF_Quad) returns (stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow);
  rpc FindStreamBatched(org.apache.jena.riot.protobuf.wire.RDF_Quad) returns (stream org.apache.jena.riot.protobuf.wire.RDF_Stream);

  rpc GetGraph(org.apache.jena.riot.protobuf.wire.RDF_Term) returns (stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow);
  rpc LoadGraph(stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow) returns (google.protobuf.Empty);
  rpc PutGraph(stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow) returns (google.protobuf.Empty);
  rpc DeleteGraph(org.apache.jena.riot.protobuf.wire.RDF_Term) returns (google.protobuf.Empty);

  rpc GetDataset(google.protobuf.Empty) returns (stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow);
  rpc LoadDataset(stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow) returns (google.protobuf.Empty);
  rpc LoadDatasetBatched(stream org.apache.jena.riot.protobuf.wire.RDF_Stream) returns (google.protobuf.Empty);
  rpc PutDataset(stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow) returns (google.protobuf.Empty);
  rpc ClearDataset(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc QuerySelect(google.protobuf.StringValue) returns (stream RDF_SelectRow);
  rpc QueryGraph(google.protobuf.StringValue) returns (stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow);
  rpc QueryDataset(google.protobuf.StringValue) returns (stream org.apache.jena.riot.protobuf.wire.RDF_StreamRow);
  rpc QueryAsk(google.protobuf.StringValue) returns (google.protobuf.BoolValue);
  rpc QueryJson(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc ExecuteUpdate(google.protobuf.StringValue) returns (google.protobuf.Empty);

  rpc ApplyPatch(stream org.apache.jena.riot.protobuf.wire.RDF_Patch_Row) returns (google.protobuf.Empty);
  rpc ApplyPatchBatch(org.apache.jena.riot.protobuf.wire.RDF_Patch) returns (google.protobuf.Empty);
  rpc SubscribePatches(google.protobuf.Empty) returns (stream org.apache.jena.riot.protobuf.wire.RDF_Patch_Row);

  rpc BeginTxn(google.protobuf.StringValue) returns (google.protobuf.StringValue);
  rpc CommitTxn(google.protobuf.StringValue) returns (google.protobuf.Empty);
  rpc AbortTxn(google.protobuf.StringValue) returns (google.protobuf.Empty);
  rpc EndTxn(google.protobuf.StringValue) returns (google.protobuf.Empty);
  rpc PromoteTxn(google.protobuf.StringValue) returns (google.protobuf.BoolValue);
}
