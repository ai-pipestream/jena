// Encoding in Protobuf of RDF terms and other items 
// for Graph, Datasets, Result Set and Patches.

// Protobuf messages are not self-delimiting so we need "containers" like RDF_Graph

syntax = "proto3";

option java_package         = "org.apache.jena.riot.protobuf.wire" ;

// Prefer one file with static inner classes.
option java_outer_classname = "PB_RDF" ;
// Optimize for speed (default)
option optimize_for = SPEED ;

//option java_multiple_files = true;
// ==== RDF Term Definitions 

message RDF_IRI {
  string iri = 1 ;
} 
 
// A prefix name (abbrev for an IRI)
message RDF_PrefixName {
  string prefix = 1 ;
  string localName = 2 ;
} 

message RDF_BNode {
  string label = 1 ;
  // 2 * fixed64
} 

// Common abbreviations for datatypes and other URIs?
// union with additional values. 

message RDF_Literal {
  string lex = 1 ;
  oneof literalKind {
    bool simple = 9 ;
    string langtag = 2 ;    // Language tag only literal
    string langdir = 5 ;    // Language tag and base direction separated by "--"
    string datatype = 3 ;
    RDF_PrefixName dtPrefix = 4 ;
    // Version 2: index into the datatype table (see RDF_Header).
    uint32 datatypeRef = 6 ;
  }
}

message RDF_Decimal {
  sint64  value = 1 ;
  sint32  scale = 2 ;
}

message RDF_Var {
  string name = 1 ;
}

message RDF_ANY { }

message RDF_UNDEF { }

// Not written by Jena; a version 2 stream leaves out a repeated term instead.
message RDF_REPEAT { }

// Version 2: an IRI as its namespace, the IRI up to and including its last
// '/' or '#', and the local name after it. The namespace is written in full
// the first time and as a reference to the namespace table after that (see
// RDF_Header).
message RDF_NsIRI {
  oneof ns {
    string namespace    = 1 ;
    uint32 namespaceRef = 2 ;
  }
  string localName = 3 ;
}

message RDF_Term {
  oneof term {
    RDF_IRI        iri        = 1 ;
    RDF_BNode      bnode      = 2 ;
    RDF_Literal    literal    = 3 ;
    RDF_PrefixName prefixName = 4 ;
    RDF_Var        variable   = 5 ;
    RDF_Triple     tripleTerm = 6 ;
    RDF_ANY        any        = 7 ;
    RDF_UNDEF      undefined  = 8 ;
    RDF_REPEAT     repeat     = 9 ;

    // Version 2 (see RDF_Header).
    RDF_NsIRI      nsIri      = 11 ;

    // Value forms of literals.
    sint64         valInteger = 20 ;
    double         valDouble  = 21 ;
    RDF_Decimal    valDecimal = 22 ;
  }
}

// === StreamRDF items 

// Version 2: a term in the term table is written as a reference (sRef, pRef,
// oRef, gRef) instead of as an RDF_Term, and a term that is the same as the
// term in the same position of the previous triple or quad is left out.
message RDF_Triple {
  RDF_Term S = 1 ;
  RDF_Term P = 2 ;
  RDF_Term O = 3 ;
  uint32 sRef = 4 ;
  uint32 pRef = 5 ;
  uint32 oRef = 6 ;
}

message RDF_Quad {
  RDF_Term S = 1 ;
  RDF_Term P = 2 ;
  RDF_Term O = 3 ;
  RDF_Term G = 4 ;
  uint32 sRef = 5 ;
  uint32 pRef = 6 ;
  uint32 oRef = 7 ;
  uint32 gRef = 8 ;
}

// Prefix declaration
message RDF_PrefixDecl {
  string prefix = 1;
  string uri    = 2 ;
}

// Stream header (version 2).
//
// A version 1 stream has no header: every term is written in full.
//
// A version 2 stream starts with a header row and may then leave out repeated
// terms and use the references RDF_Triple.sRef (and pRef, oRef, RDF_Quad.gRef),
// RDF_NsIRI.namespaceRef and RDF_Literal.datatypeRef. The
// reader and writer each keep three tables that are filled in the same, fixed
// way as the stream is processed, so no table entries are sent explicitly:
//
//   Term table: every IRI, prefix name and blank node written in full
//   (including those inside triple terms, in subject, predicate, object
//   order) is placed in a slot of the table. A reference is a distance back
//   from the most recently placed term: 1 is that term, 2 the one placed
//   before it, and so on. Slots are taken in order, wrapping round to slot 0
//   when the table is full, except that a slot whose term has been referenced
//   since it was placed is passed over once and its term kept (clock
//   replacement: passing over it clears the mark, so the slot is taken next
//   time round unless the term is referenced again).
//
//   Namespace table: every namespace written in full (RDF_NsIRI.namespace)
//   is placed in the next slot of the namespace table, wrapping round when
//   the table is full. A namespaceRef is a distance back from the most
//   recently placed namespace, as for the term table.
//
//   Datatype table: every datatype IRI written in full (RDF_Literal.datatype)
//   is placed in the next slot of the datatype table, wrapping round when the
//   table is full. A datatypeRef is the slot of a datatype written earlier.
//
// A header part way through a stream starts all tables again, so
// version 2 streams can be concatenated.
message RDF_Header {
  uint32 version = 1 ;             // Currently 2.
  uint32 termTableSize = 2 ;       // Number of slots in the term table.
  uint32 datatypeTableSize = 3 ;   // Number of slots in the datatype table.
  uint32 namespaceTableSize = 4 ;  // Number of slots in the namespace table.
}

// StreamRDF
message RDF_StreamRow {
  oneof row {
    RDF_PrefixDecl   prefixDecl  = 1 ;
    RDF_Triple       triple      = 2 ;
    RDF_Quad         quad        = 3 ;
    RDF_IRI          base        = 4 ;
    RDF_Header       header      = 5 ;
  }
}

message RDF_Stream {
  repeated RDF_StreamRow row = 1 ;
}

// ==== SPARQL Result Sets

message RDF_VarTuple {
  repeated RDF_Var vars = 1 ;
}

message RDF_DataTuple {
  repeated RDF_Term row = 1 ;
}

// ==== RDF Graph

message RDF_Graph {
  repeated RDF_Triple triple = 1 ;
}

// ==== RDF Patch

// Used exclusively inside RDF_Patch_Row.oneof row, which provides explicit presence tracking for TX = 0.
enum PatchTxn {
  TX      = 0 ;
  TC      = 1 ;
  TA      = 2 ;
  Segment = 3 ;
}

message Patch_Prefix_Add {
  RDF_Term graphNode = 1 ;
  string   prefix    = 2 ;
  string   iriStr    = 3 ;
}

message Patch_Prefix_Del {
  RDF_Term graphNode = 1 ;
  string   prefix    = 2 ;
}

message Patch_Header {
  string   name  = 1 ;
  RDF_Term value = 2 ;
}

message Patch_Data_Add {
  RDF_Term s = 1 ;
  RDF_Term p = 2 ;
  RDF_Term o = 3 ;
  RDF_Term g = 4 ;
}

message Patch_Data_Del {
  RDF_Term s = 1 ;
  RDF_Term p = 2 ;
  RDF_Term o = 3 ;
  RDF_Term g = 4 ;
}

message RDF_Patch_Row {
  oneof row {
    Patch_Header     header    = 1 ;
    Patch_Data_Add   dataAdd   = 2 ;
    Patch_Data_Del   dataDel   = 3 ;
    Patch_Prefix_Add prefixAdd = 4 ;
    Patch_Prefix_Del prefixDel = 5 ;
    PatchTxn         txn       = 6 ;
  }
}

message RDF_Patch {
  repeated RDF_Patch_Row row = 1 ;
}

